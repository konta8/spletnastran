
<!DOCTYPE html>
<html lang="sl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OŠ RadljeobDravi</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, Helvetica, sans-serif;
            background: linear-gradient(to right, #344f60, #e87520);
            color: #263445;
            min-height: 100vh;
            line-height: 1.7;
        }

        h1 {
            color: red;
            text-align: center;
            font-size: 38px;
            padding: 30px 15px;
            margin: 0;
            background: rgba(255, 255, 255, 0.95);
        }

        .container {
            max-width: 900px;
            margin: 40px auto;
            padding: 30px;
            background: white;
            border-radius: 18px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
        }

        .school-image {
            display: block;
            width: 100%;
            max-width: 400px;
            height: auto;
            margin: 20px auto;
            border-radius: 14px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.15);
        }

        h2 {
            color: #344f60;
            font-size: 28px;
            border-bottom: 3px solid #e87520;
            padding-bottom: 10px;
        }

        p {
            font-size: 17px;
        }

        .back-link {
            display: inline-block;
            margin-top: 15px;
            padding: 10px 15px;
            background: #edf2f7;
            border-radius: 10px;
            transition: 0.3s;
        }

        .back-link:hover {
            background: #dbeafe;
            transform: translateY(-3px);
        }

        @media (max-width: 600px) {
            h1 {
                font-size: 28px;
            }

            .container {
                margin: 20px 12px;
                padding: 20px;
            }

            h2 {
                font-size: 23px;
            }
        }
    </style>
</head>

<body>

    <!-- KOMENTAR-->
    <h1 style="color: red;">Osnovna šola Radlje ob Dravi</h1>

    <main class="container">

        <img src="osradlje.jpg" width="400" alt="" class="school-image">

        <br>

        <h2>opis OŠ Radlje ob Dravi</h2>

        <p>
            Osnovna šola Radlje ob Dravi je javna osnovna šola, ki se nahaja v kraju Radlje ob Dravi.
        </p>

        <br>

        <a href="index.html" class="back-link">
            <img src="puscica.png" width="50" alt="">
        </a>

    </main>

</body>
</html>
